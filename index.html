<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSDV Reporting System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">
    <div class="card p-4 shadow" style="width:100%; max-width:420px;">

        <h4 class="text-center mb-1">MSDV Reporting System</h4>
        <p class="text-center text-muted mb-4">Student Disciplinary Management</p>

        <!-- Error message placeholder -->
        <div id="errorBox" class="alert alert-danger py-2 d-none"></div>

        <form id="loginForm" autocomplete="off">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    required
                    autofocus
                >
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    required
                >
            </div>
            <div class="mb-4 form-check">
                <input
                    type="checkbox"
                    class="form-check-input"
                    id="rememberMe"
                >
                <label class="form-check-label" for="rememberMe">Remember Me</label>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="loginBtn">Login</button>
        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Load remembered username from localStorage
    window.addEventListener('DOMContentLoaded', function () {
        const savedUser = localStorage.getItem('remember_user');
        if (savedUser) {
            document.getElementById('username').value = savedUser;
            document.getElementById('rememberMe').checked = true;
        }
    });

    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const remember = document.getElementById('rememberMe').checked;
        const errorBox = document.getElementById('errorBox');
        const loginBtn = document.getElementById('loginBtn');

        errorBox.classList.add('d-none');
        errorBox.textContent = '';
        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';

        // Save or clear remembered username
        if (remember) {
            localStorage.setItem('remember_user', username);
        } else {
            localStorage.removeItem('remember_user');
        }

        // Send to login.php
        fetch('login.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                window.location.href = data.redirect;
            } else {
                errorBox.textContent = data.message;
                errorBox.classList.remove('d-none');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        })
        .catch(() => {
            errorBox.textContent = 'Something went wrong. Please try again.';
            errorBox.classList.remove('d-none');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
        });
    });
</script>
</body>
</html>
